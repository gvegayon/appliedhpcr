name: Build and Deploy

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  build-html:
    runs-on: ubuntu-22.04

    container:
      image: ghcr.io/gvegayon/appliedhpcr:latest

    steps:
    - uses: actions/checkout@v6

    - name: Render English version
      run: |
        quarto render --to html

    - name: Upload artifact
      # uses: actions/upload-pages-artifact@v3
      uses: actions/upload-artifact@v7
      with:
        path: _book
        name: gh-page-html

  build-html-es:
    runs-on: ubuntu-22.04

    container:
      image: ghcr.io/gvegayon/appliedhpcr:latest

    steps:
    - uses: actions/checkout@v6

    - name: Render Spanish version
      run: |
        cd es && quarto render --to html

    - name: Upload artifact
      # uses: actions/upload-pages-artifact@v3
      uses: actions/upload-artifact@v7
      with:
        path: es/_book
        name: gh-page-html-es

  build-pdf:
    runs-on: ubuntu-22.04

    container:
      image: ghcr.io/gvegayon/appliedhpcr:latest

    steps:
    - uses: actions/checkout@v6

    - name: Render English PDF
      run: |
        quarto render --to orange-book-typst

    - name: Combine docs
      run: |
        mkdir -p _book/es
        cp -r es/_book/* _book/es/ 2>/dev/null || true

    - name: Upload artifact
      # uses: actions/upload-pages-artifact@v3
      uses: actions/upload-artifact@v7
      with:
        path: _book
        name: gh-page-pdf

    - name: Upload LaTeX file
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: |
          _book/*.tex
          *.tex
          *.log
          _book/*log
        name: gh-page-latex-logs

  build-pdf-es:
    runs-on: ubuntu-22.04

    container:
      image: ghcr.io/gvegayon/appliedhpcr:latest

    steps:
    - uses: actions/checkout@v6

    - name: Render Spanish PDF
      run: |
        cd es && quarto render --to orange-book-typst

    - name: Combine docs
      run: |
        mkdir -p _book/es
        cp -r es/_book/* _book/es/ 2>/dev/null || true

    - name: Upload artifact
      # uses: actions/upload-pages-artifact@v3
      uses: actions/upload-artifact@v7
      with:
        path: es/_book
        name: gh-page-pdf-es

    - name: Upload LaTeX file
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: |
          es/_book/*.tex
          es/*.tex
          es/*.log
          es/_book/*log
        name: gh-page-latex-logs-es

  combine:
    runs-on: ubuntu-22.04

    needs: [build-html, build-html-es, build-pdf, build-pdf-es]

    steps:

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: gh-page-html
        path: _book

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: gh-page-html-es
        path: _book/es

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: gh-page-pdf
        path: pdf

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: gh-page-pdf-es
        path: pdf-es

    - name: Combine
      run: |
        cp -r pdf/* _book
        cp -r pdf-es/* _book/es

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      # uses: actions/upload-artifact@v3
      with:
        name: github-pages
        path: |
          _book/*

  deploy:
    runs-on: ubuntu-latest
    needs: combine
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean existing files
        run: |
          rm -rf _book || echo "No _book directory to remove"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: _book

      - name: Commit changes
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add -f _book/* || echo "Nothing to add"
          git add -f _book/*_files || echo "Nothing to add"
          git add -f _book/*_libs || echo "Nothing to add"
          git add -f _book/es/* || echo "Nothing to add"
          git add -f _book/es/*_files || echo "Nothing to add"
          git add -f _book/es/*_libs || echo "Nothing to add"
          git commit -m "Updating the book" || echo "Nothing to commit"
          git push || echo "Nothing to push"
