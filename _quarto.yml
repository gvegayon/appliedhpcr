project:
  type: book
  post-render: _hreflang.R

extensions:
  - quarto-ext/orange-book

engine: knitr
lang: en
book:
  version: 2026.03.18
  google-analytics: "G-9D75EFV0TE"
  title: "Applied HPC with R"
  subtitle: "C++, Parallelism, and Performance"
  author: "George G. Vega Yon"
  repo-url: https://github.com/gvegayon/appliedhpcr
  repo-branch: master
  issue-url: https://github.com/gvegayon/appliedhpcr/issues
  repo-actions: [edit, source, issue]
  cover-image: 'fig/cover.png'
  cover-image-alt: 'Cover image for Applied HPC with R'
  site-url: https://book-hpc.ggvy.cl
  image: fig/social-card.jpg
  image-alt: 'Applied HPC with R: C++, Parallelism, and Performance'
  favicon: fig/favicon.ico
  open-graph: true
  twitter-card:
    card-style: summary_large_image
    creator: "@gvegayon"
  sharing: [twitter, linkedin]
  page-navigation: true
  page-footer: Applied HPC with R - [https://ggvy.cl](https://ggvy.cl){target="_blank"} - [Versión en español](https://book-hpc.ggvy.cl/es/){hreflang="es"}
  original-date: 2023-04-09
  date: 2025-09-04
  chapters:
    - index.qmd
    - part: "Fundamentals"
      chapters:
      - profiling.qmd
      - efficiency.qmd
    - part: "Parallel computing"
      chapters:
      - intro.qmd
      - parallel-pkg.qmd
    - part: "Working with a Cluster"
      chapters:
        - slurm-fundamentals.qmd
        - slurm-simpi.qmd
    - part: "Using C++"
      chapters:
        - rcpp-part1.qmd
        - rcpp-debugging.qmd
  appendices: 
    - scoping-cpp.qmd
    - misc.qmd
    - references.qmd
    - news.qmd
  downloads:
    - pdf

bibliography: references.bib

# Social-media preview for every page
image: fig/social-card.jpg
image-alt: 'Applied HPC with R: C++, Parallelism, and Performance'

format:
  html:
    html-math-method: katex
    toc: true
    number-sections: false
    theme: cosmo
    canonical-url: true
  orange-book-typst: default

