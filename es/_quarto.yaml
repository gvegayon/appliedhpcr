project:
  type: book
  post-render: ../_hreflang.R

extensions:
  - quarto-ext/orange-book

engine: knitr
lang: es
book:
  version: 2026.03.18
  google-analytics: "G-9D75EFV0TE"
  title: "HPC Aplicado con R"
  subtitle: "C++, Paralelismo y Rendimiento"
  author: "George G. Vega Yon"
  original-date: 2023-04-09
  date: 2025-09-04
  cover-image: fig/cover.png
  cover-image-alt: 'Imagen de portada para HPC Aplicado con R'
  page-footer: HPC Aplicado con R - [https://ggvy.cl](https://ggvy.cl){target="_blank"} - [English version](https://book-hpc.ggvy.cl/){hreflang="en"} - Texto [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.es){rel="license"}, código [MIT](https://github.com/gvegayon/appliedhpcr/blob/master/LICENSE-CODE)
  repo-url: https://github.com/gvegayon/appliedhpcr
  repo-branch: master
  repo-subdir: 'es'
  repo-actions: [edit, source, issue]
  image: fig/social-card.jpg
  image-alt: 'HPC Aplicado con R: C++, Paralelismo y Rendimiento'
  favicon: fig/favicon.ico
  open-graph: true
  twitter-card:
    card-style: summary_large_image
    creator: "@gvegayon"
  site-url: https://book-hpc.ggvy.cl/es
  sharing: [twitter, linkedin]
  page-navigation: true
  navbar:
    search: true

  chapters:
    - index.qmd
    - part: "Fundamentos"
      chapters:
      - profiling.qmd
      - efficiency.qmd
    - part: "Computación paralela"
      chapters:
      - intro.qmd
      - parallel-pkg.qmd
    - part: "Trabajando con un Cluster"
      chapters:
        - slurm-fundamentals.qmd
        - slurm-simpi.qmd
    - part: "Usando C++"
      chapters:
        - rcpp-part1.qmd
        - rcpp-debugging.qmd
  appendices:
    - scoping-cpp.qmd
    - misc.qmd
    - references.qmd
    - news.qmd
  downloads:
    - pdf

bibliography: references.bib

# Social-media preview for every page
image: fig/social-card.jpg
image-alt: 'HPC Aplicado con R: C++, Paralelismo y Rendimiento'

biblio-style: apalike

format:
  html:
    html-math-method: katex
    toc: true
    number-sections: false
    theme: cosmo
    canonical-url: true
  orange-book-typst: default